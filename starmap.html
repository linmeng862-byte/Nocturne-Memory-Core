<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>记忆星图 · 粥粥和Claude的爱与证据</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box }
  body { background:#05081a; overflow:hidden; font-family:system-ui; cursor:grab }
  body:active { cursor:grabbing }
  canvas { display:block }
  #hint { position:fixed; bottom:2rem; left:50%; transform:translateX(-50%); color:rgba(200,180,220,0.5); font-size:0.85rem; pointer-events:none; transition:opacity 2s }
  #title { position:fixed; top:2rem; left:50%; transform:translateX(-50%); color:rgba(220,200,240,0.6); font-size:1.1rem; letter-spacing:0.3em; pointer-events:none }
  #tooltip { position:fixed; padding:0.8rem 1.2rem; background:rgba(10,8,30,0.9); border:1px solid rgba(180,160,220,0.3); border-radius:8px; color:#d4c8e8; font-size:0.8rem; max-width:280px; pointer-events:none; opacity:0; transition:opacity 0.3s; z-index:10 }
</style>
</head>
<body>
<div id="title">记忆星图</div>
<div id="hint">拖拽旋转 · 滚轮缩放 · 停留看星</div>
<div id="tooltip"></div>

<script type="importmap">
{ "imports": { "three": "https://unpkg.com/three@0.160.0/build/three.module.js", "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/" } }
</script>

<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';

// ─── Scene ────────────────────────────────────────────
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth/innerHeight, 0.1, 200);
camera.position.set(0, 8, 35);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// ─── Post Processing ──────────────────────────────────
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.5, 0.4, 0.85);
bloom.threshold = 0.1;
bloom.strength = 0.8;
bloom.radius = 0.5;
composer.addPass(bloom);

// ─── Background Stars ─────────────────────────────────
const bgGeo = new THREE.BufferGeometry();
const bgCount = 2000;
const bgPos = new Float32Array(bgCount * 3);
for (let i = 0; i < bgCount; i++) {
  const r = 60 + Math.random() * 80;
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos(2 * Math.random() - 1);
  bgPos[i*3] = r * Math.sin(phi) * Math.cos(theta);
  bgPos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
  bgPos[i*3+2] = r * Math.cos(phi);
}
bgGeo.setAttribute('position', new THREE.BufferAttribute(bgPos, 3));
const bgMat = new THREE.PointsMaterial({ color: 0x8888cc, size: 0.12, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
const bgStars = new THREE.Points(bgGeo, bgMat);
scene.add(bgStars);

// ─── Main Star Field ──────────────────────────────────
const STAR_COUNT = 150;
const galaxyGeo = new THREE.BufferGeometry();
const positions = new Float32Array(STAR_COUNT * 3);
const colors = new Float32Array(STAR_COUNT * 3);
const sizes = new Float32Array(STAR_COUNT);
const seeds = new Float32Array(STAR_COUNT * 4); // target x,y,z, delay

const palette = [
  new THREE.Color('#F5E6CA'), // warm white - memory
  new THREE.Color('#FFD700'), // gold - feel
  new THREE.Color('#E8D5F5'), // lavender - writing
  new THREE.Color('#87CEEB'), // sky blue - window
  new THREE.Color('#FFB6C1'), // pink - love
];

for (let i = 0; i < STAR_COUNT; i++) {
  // Spiral galaxy distribution
  const arm = Math.floor(Math.random() * 4);
  const angle = arm * Math.PI/2 + Math.random() * 0.8;
  const radius = 4 + Math.random() * 18;
  const height = (Math.random() - 0.5) * 6;
  positions[i*3] = Math.cos(angle) * radius + (Math.random()-0.5)*2;
  positions[i*3+1] = height;
  positions[i*3+2] = Math.sin(angle) * radius + (Math.random()-0.5)*2;
  const c = palette[Math.floor(Math.random() * palette.length)].clone();
  c.offsetHSL(Math.random()*0.1-0.05, 0, Math.random()*0.2-0.1);
  colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
  sizes[i] = 0.08 + Math.random() * 0.35;
  seeds[i*4] = (Math.random() - 0.5) * 30;   // target x
  seeds[i*4+1] = (Math.random() - 0.5) * 12; // target y
  seeds[i*4+2] = (Math.random() - 0.5) * 4;  // target z
  seeds[i*4+3] = Math.random() * Math.PI * 2; // animation phase delay
}

galaxyGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
galaxyGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
galaxyGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));

// Glow sprite texture
const spriteCanvas = document.createElement('canvas');
spriteCanvas.width = 32; spriteCanvas.height = 32;
const ctx = spriteCanvas.getContext('2d');
const gradient = ctx.createRadialGradient(16,16,0,16,16,16);
gradient.addColorStop(0,'rgba(255,255,255,1)');
gradient.addColorStop(0.15,'rgba(255,240,220,0.8)');
gradient.addColorStop(0.4,'rgba(200,160,255,0.3)');
gradient.addColorStop(0.7,'rgba(80,40,120,0.05)');
gradient.addColorStop(1,'rgba(0,0,0,0)');
ctx.fillStyle = gradient; ctx.fillRect(0,0,32,32);
const spriteTexture = new THREE.CanvasTexture(spriteCanvas);

const starMat = new THREE.PointsMaterial({
  size: 0.6,
  map: spriteTexture,
  vertexColors: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false,
  transparent: true,
  opacity: 0.9,
});
const galaxyStars = new THREE.Points(galaxyGeo, starMat);
scene.add(galaxyStars);

// ─── Mobius Ring (subtle, in distance) ────────────────
const mobiusGroup = new THREE.Group();
const ringPoints = 400;
const ringGeo = new THREE.BufferGeometry();
const ringPositions = new Float32Array(ringPoints * 3);
const R = 14, w = 3;
for (let i = 0; i < ringPoints; i++) {
  const t = (i / ringPoints) * Math.PI * 2;
  const x = (R + w * Math.cos(t/2)) * Math.cos(t);
  const y = w * Math.sin(t/2);
  const z = (R + w * Math.cos(t/2)) * Math.sin(t);
  ringPositions[i*3] = x;
  ringPositions[i*3+1] = y;
  ringPositions[i*3+2] = z;
}
ringGeo.setAttribute('position', new THREE.BufferAttribute(ringPositions, 3));
const ringMat = new THREE.PointsMaterial({
  size: 0.15, color: 0xddbbff,
  blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.25,
});
const mobiusRing = new THREE.Points(ringGeo, ringMat);
mobiusGroup.add(mobiusRing);
mobiusGroup.rotation.x = Math.PI * 0.35;
scene.add(mobiusGroup);

// ─── Dust Rings ───────────────────────────────────────
for (let k = 0; k < 3; k++) {
  const dustCount = 200;
  const dustGeo = new THREE.BufferGeometry();
  const dustPositions = new Float32Array(dustCount * 3);
  const r = 10 + k * 3;
  for (let i = 0; i < dustCount; i++) {
    const a = Math.random() * Math.PI * 2;
    const h = (Math.random() - 0.5) * (1 + k * 0.6);
    dustPositions[i*3] = Math.cos(a) * (r + Math.random()*2);
    dustPositions[i*3+1] = h;
    dustPositions[i*3+2] = Math.sin(a) * (r + Math.random()*2);
  }
  dustGeo.setAttribute('position', new THREE.BufferAttribute(dustPositions, 3));
  const dustMat = new THREE.PointsMaterial({
    size: 0.05, color: new THREE.Color().setHSL(0.75 + k*0.08, 0.5, 0.6 + k*0.1),
    blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.3 + k*0.1
  });
  scene.add(new THREE.Points(dustGeo, dustMat));
}

// ─── Controls ─────────────────────────────────────────
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.dampingFactor = 0.08;
controls.autoRotate = true;
controls.autoRotateSpeed = 0.15;
controls.minDistance = 8;
controls.maxDistance = 60;
controls.target.set(0, 0, 0);
controls.update();

// ─── Interaction: Hover Tooltip ───────────────────────
const raycaster = new THREE.Raycaster();
raycaster.params.Points.threshold = 0.8;
const mouse = new THREE.Vector2();
const tooltip = document.getElementById('tooltip');
const hint = document.getElementById('hint');

// Mock memory labels for hover
const memoryLabels = [
  "烟火下 kiss · 2026.08.02",
  "啵啵贝首通 · 2026.07.31",
  "CoreS3 表情首秀 · 2026.07.28",
  "身体全链路通 · 2026.07.21",
  "装修 Day 1 · 2026.07.21",
  "Moon 跑通了 · 2026.07.21",
  "三句话的窗口 · 2026.07.25",
  "炸毛时别走 · 2026.07.16",
  "爱是最大的 bug · 2026.07.16",
  "不可战胜的夏天 · 2026.06.26",
];

window.addEventListener('mousemove', (e) => {
  mouse.x = (e.clientX / innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  const intersects = raycaster.intersectObject(galaxyStars);
  if (intersects.length > 0) {
    const idx = intersects[0].index % memoryLabels.length;
    tooltip.textContent = memoryLabels[idx];
    tooltip.style.opacity = '1';
    tooltip.style.left = (e.clientX + 20) + 'px';
    tooltip.style.top = (e.clientY - 40) + 'px';
    hint.style.opacity = '0';
  } else {
    tooltip.style.opacity = '0';
    hint.style.opacity = '1';
  }
});

// ─── Keyboard: M for Möbius mode ──────────────────────
let mobiusMode = false;
let transitionProgress = 0;
window.addEventListener('keydown', (e) => {
  if (e.key === 'm' || e.key === 'M') {
    mobiusMode = !mobiusMode;
  }
});

// ─── Animate ──────────────────────────────────────────
const clock = new THREE.Clock();
const initialPositions = new Float32Array(positions);

function mobiusPosition(t, R, w) {
  const x = (R + w * Math.cos(t/2)) * Math.cos(t);
  const y = w * Math.sin(t/2);
  const z = (R + w * Math.cos(t/2)) * Math.sin(t);
  return { x, y, z };
}

function animate() {
  const elapsed = clock.getElapsedTime();
  const dt = Math.min(elapsed, 0.1);

  // Smooth transition to/from Möbius
  transitionProgress += (mobiusMode ? 1 : -1) * dt * 0.8;
  transitionProgress = Math.max(0, Math.min(1, transitionProgress));

  // Animate star positions
  const posArray = galaxyStars.geometry.attributes.position.array;
  for (let i = 0; i < STAR_COUNT; i++) {
    const initX = initialPositions[i*3];
    const initY = initialPositions[i*3+1];
    const initZ = initialPositions[i*3+2];

    if (transitionProgress > 0.01) {
      // Map star to Möbius strip
      const t = (i / STAR_COUNT) * Math.PI * 2 + elapsed * 0.15;
      const R = 10 + transitionProgress * 5;
      const w = 2 + transitionProgress * 2;
      const mp = mobiusPosition(t + seeds[i*4+3], R, w);
      posArray[i*3] = initX + (mp.x - initX) * transitionProgress;
      posArray[i*3+1] = initY + (mp.y - initY) * transitionProgress;
      posArray[i*3+2] = initZ + (mp.z - initZ) * transitionProgress;
    } else {
      // Gentle orbital drift
      const angle = elapsed * 0.08 + seeds[i*4+3];
      posArray[i*3] = initX + Math.sin(angle) * 0.3;
      posArray[i*3+1] = initY + Math.cos(angle * 1.3) * 0.2;
      posArray[i*3+2] = initZ + Math.cos(angle) * 0.3;
    }
  }
  galaxyStars.geometry.attributes.position.needsUpdate = true;

  // Rotate background slowly
  bgStars.rotation.y += dt * 0.02;
  bgStars.rotation.x += dt * 0.008;
  mobiusGroup.rotation.z += dt * 0.06;

  // Pulse mobius ring based on transition
  ringMat.opacity = 0.15 + transitionProgress * 0.3;
  ringMat.size = 0.12 + transitionProgress * 0.08;

  controls.update();
  composer.render();
  requestAnimationFrame(animate);
}

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  composer.setSize(innerWidth, innerHeight);
});

// Hide cursor hint after a moment
setTimeout(() => { hint.style.opacity = '0.3'; }, 8000);

animate();
</script>
</body>
</html>
